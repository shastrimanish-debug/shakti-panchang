workflows:
  android-debug:
    name: Shakti Panchang Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - debug_keystore
    scripts:
      - name: Build Astronomy Engine native Android libraries
        script: bash rust/build_android.sh
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build Android debug bundle
        script: flutter build appbundle --debug
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
