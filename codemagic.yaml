workflows:
  shakti_panchang_release:
    name: Shakti Panchang Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - shakti_panchang_play_signing
    scripts:
      - name: Show Flutter toolchain
        script: |
          flutter --version
          dart --version
      - name: Configure Play upload keystore
        script: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || (echo 'Missing KEYSTORE_BASE64 environment variable' && exit 1)
          test -n "${KEYSTORE_PASSWORD:-}" || (echo 'Missing KEYSTORE_PASSWORD environment variable' && exit 1)
          test -n "${KEY_ALIAS:-}" || (echo 'Missing KEY_ALIAS environment variable' && exit 1)
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/shakti-panchang-upload.jks"
          test -s "$CM_BUILD_DIR/shakti-panchang-upload.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$CM_BUILD_DIR/shakti-panchang-upload.jks
          EOF
      - name: Build Astronomy Engine native Android libraries
        script: bash rust/build_android.sh
      - name: Flutter clean
        script: flutter clean
      - name: Flutter pub get
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter tests
        script: flutter test
      - name: Build signed release APK
        script: flutter build apk --release
      - name: Build signed release AAB
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
