plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def buildAstronomyEngineNative = tasks.register("buildAstronomyEngineNative") {
    group = "Astronomy Engine"
    description = "Build and package the native astronomy library if cargo-ndk is present."
    doLast {
        def script = file("${rootProject.projectDir}/../rust/build_android.sh")
        if (!script.exists()) {
            println("⚠️ Native build script not found: ${script}. Skipping native compilation.")
            return
        }
        
        // Check if cargo is installed
        def checkCargo = "which cargo".execute().waitFor()
        if (checkCargo != 0) {
            println("⚠️ Cargo not found on this runner. Skipping native build.")
            return
        }

        // Check if cargo-ndk is installed to prevent exit code 101
        def checkNdk = "cargo ndk --version".execute()
        checkNdk.waitFor()
        if (checkNdk.exitValue() != 0) {
            println("⚠️ cargo-ndk tool is not installed. Skipping native build to allow CI build to succeed.")
            return
        }

        def proc = ["bash", script.absolutePath].execute(null, rootProject.projectDir.parentFile)
        proc.in.eachLine { println(it) }
        proc.err.eachLine { System.err.println(it) }
        def code = proc.waitFor()
        if (code != 0) {
            throw new GradleException("Native astronomy build failed with exit code ${code}")
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(buildAstronomyEngineNative)
}

// Production release signing is loaded from android/key.properties.
// The private keystore must never be committed to GitHub.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.shivshakti.shaktipanchang"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.shivshakti.shaktipanchang"
        minSdk = 21
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // CI/test builds may not have the private Play signing key.
            // Use debug signing only as a temporary local/CI fallback.
            // Production Play Store builds must provide android/key.properties.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

flutter {
    source = "../.."
}
